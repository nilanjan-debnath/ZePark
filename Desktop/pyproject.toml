[project]
name = "zepark-desktop"
version = "0.2.0"
description = "This is the desktop application for the ZePark project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cvzone>=1.6.1",
    "numpy>=2.1.3",
    "opencv-python>=4.11.0.86",
    "pillow>=11.2.1",
    "pyside6>=6.9.0",
    "tensorflow>=2.19.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.6",
]
